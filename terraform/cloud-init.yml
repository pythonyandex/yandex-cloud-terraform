#cloud-config
package_update: true
package_upgrade: false

packages:
  - curl
  - wget
  - tree
  - nginx
  - vim

runcmd:
  - sudo echo "=== Cloud-init nachal работу ===" >> /home/ubuntu/cloud-init-debug.txt
  # Тестовая команда 5 - установка Docker
  - sudo apt update -y
 # - sudo apt install -y docker.io docker-compose
 # - sudo systemctl enable docker
 # - sudo systemctl start docker
 # - sudo usermod -aG docker ubuntu
  - sudo mkdir -m 0755 -p /etc/apt/keyrings
  - sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - sudo chmod a+r /etc/apt/keyrings/docker.gpg
  - sudo echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
  - sudo apt update
  - sudo apt install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y
  # Тестовая команда 6 - проверка Docker
  - sudo docker --version >> /home/ubuntu/cloud-init-debug.txt 2>&1 || echo "Docker не установлен" >> /home/ubuntu/cloud-init-debug.txt

  # Тестовая команда 7 - запуск тестового контейнера
  - sudo docker run --rm hello-world >> /home/ubuntu/cloud-init-debug.txt 2>&1

  # Тестовая команда 8
  - sudo echo "=== Cloud-init завершил работу ===" >> /home/ubuntu/cloud-init-debug.txt
  - sudo systemctl enable nginx
  - sudo systemctl start nginx
  - cd /home/ubuntu
  - sudo git clone https://github.com/pythonyandex/shvirtd-test.git
  - sudo chown -R ubuntu:ubuntu /home/ubuntu/shvirtd-test
  
  # Создаем .env файл с переменными окружения
  - cd /home/ubuntu/shvirtd-test
  #- sudo chown ubuntu:ubuntu .env  
  # Запускаем Docker Compose
  - sudo docker-compose build
  - sudo docker-compose up -d
  - sudo iptables -I INPUT -p tcp --dport 8090 -j ACCEPT
  
write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Welcome to Netology!</title>
      </head>
      <body>
        <h1>Hello from Netology!</h1>
        <p>This VM was provisioned with cloud-init.</p>
      </body>
      </html>
    owner: root:root
    permissions: '0644'
  - path: /home/ubuntu/welcome-static.txt
    content: |
      Welcome!
      This server was configured automatically via cloud-init.
    owner: ubuntu:ubuntu
    permissions: '0644'
  - path: /home/ubuntu/.env
    content: |
      MYSQL_ROOT_PASSWORD=YtReWq4321
      MYSQL_DATABASE=example
      MYSQL_USER=app
      MYSQL_PASSWORD=QwErTy1234
      DB_PASSWORD=QwErTy1234
    owner: ubuntu:ubuntu
    permissions: '0644'
final_message: "Cloud-init завершил выполнение за $UPTIME секунд"
